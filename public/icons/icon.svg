<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d24"/>
      <stop offset="100%" stop-color="#15153a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4af0ff"/>
      <stop offset="55%" stop-color="#2fd8ff"/>
      <stop offset="100%" stop-color="#7d5cff"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)" stroke="url(#edge)" stroke-width="16"/>
  <!-- Matrix grid dots -->
  <circle cx="96" cy="128" r="10" fill="#4af0ff" opacity="0.25"/>
  <circle cx="416" cy="128" r="10" fill="#4af0ff" opacity="0.25"/>
  <circle cx="96" cy="384" r="10" fill="#4af0ff" opacity="0.25"/>
  <circle cx="416" cy="384" r="10" fill="#4af0ff" opacity="0.25"/>
  <!-- Bibash monogram as the prompt -->
  <text x="96" y="326" font-family="'Anonymous Pro', 'Courier New', monospace" font-size="250" font-weight="700" fill="#4af0ff">B</text>
  <!-- Terminal cursor -->
  <rect x="330" y="120" width="48" height="180" rx="16" fill="#00ff41">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>